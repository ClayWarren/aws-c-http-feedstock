schema_version: 1

context:
  version: "0.11.0"

package:
  name: aws-c-http
  version: ${{ version }}

source:
  url: https://github.com/awslabs/aws-c-http/archive/v${{ version }}.tar.gz
  sha256: 4ccbdd33c798b590288330dec9e93abe2ff6cfb198b7a4db036c9d362f2e6506

build:
  number: 1

requirements:
  build:
    - cmake
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
    - ninja
  host:
    - aws-c-cal
    - aws-c-common
    - aws-c-compression
    - aws-c-io
  run_exports:
    - ${{ pin_subpackage("aws-c-http", upper_bound="x.x.x") }}

tests:
  - script:
      - if: unix
        then:
          - test -f $PREFIX/lib/libaws-c-http${SHLIB_EXT}
          - test -f $PREFIX/include/aws/http/http.h
      - if: win
        then:
          - if not exist %LIBRARY_INC%\\aws\\http\\http.h exit 1
          - if not exist %PREFIX%\\Library\\bin\\aws-c-http.dll exit 1
  - if: win and arm64
    then:
      requirements:
        run:
          - ${{ compiler('c') }}
          - cmake
      files:
        recipe:
          - CMakeLists.txt
          - consumer.c
      script:
        - cmake -S . -B consumer-build -G "NMake Makefiles" -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="%LIBRARY_PREFIX%"
        - cmake --build consumer-build
        - consumer-build\http_consumer.exe
        - dumpbin /headers "%LIBRARY_BIN%\aws-c-http.dll" | findstr /I /C:"AA64 machine (ARM64)"
        - dumpbin /headers consumer-build\http_consumer.exe | findstr /I /C:"AA64 machine (ARM64)"
about:
  license: Apache-2.0
  license_file: LICENSE
  summary: C99 implementation of the HTTP/1.1 and HTTP/2 specifications
  homepage: https://github.com/awslabs/aws-c-http
  repository: https://github.com/awslabs/aws-c-http

extra:
  feedstock-name: aws-c-http
  recipe-maintainers:
    - xhochy
    - conda-forge/aws-sdk-cpp
