name: aws-c-http native Windows ARM64
on:
  push:
    branches: [codex/aws-http-arm64-probe]
permissions:
  contents: read
  actions: read
jobs:
  probe:
    if: github.repository == 'ClayWarren/aws-c-http-feedstock'
    runs-on: windows-11-arm
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        config: [win_arm64_]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Retrieve verified native AWS prerequisites
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Path C:/aws-c-http-prereqs/win-arm64 -Force | Out-Null
          gh run download 34648321112 --repo ClayWarren/aws-c-common-feedstock --name aws-c-common-arm64-package --dir "$env:RUNNER_TEMP/aws-c-common"
          if ($LASTEXITCODE -ne 0) { throw 'Artifact download failed' }
          $pkg = @(Get-ChildItem "$env:RUNNER_TEMP/aws-c-common" -Recurse -Filter 'aws-c-common-0.14.4-hfbbf558_1.conda')
          if ($pkg.Count -ne 1) { throw 'Expected one exact prerequisite' }
          if ((Get-FileHash $pkg[0].FullName -Algorithm SHA256).Hash.ToLower() -ne '81c83f63fb36ffcd87bb4ea6b4dc04e6ac5b72e0a2d406ce088fba694050cb6d') { throw 'Prerequisite checksum mismatch' }
          Copy-Item $pkg[0].FullName C:/aws-c-http-prereqs/win-arm64/
          gh run download 34654361445 --repo ClayWarren/aws-c-cal-feedstock --name aws-c-cal-arm64-package --dir "$env:RUNNER_TEMP/aws-c-cal"
          if ($LASTEXITCODE -ne 0) { throw 'Artifact download failed' }
          $pkg = @(Get-ChildItem "$env:RUNNER_TEMP/aws-c-cal" -Recurse -Filter 'aws-c-cal-0.9.15-hc76c474_3.conda')
          if ($pkg.Count -ne 1) { throw 'Expected one exact prerequisite' }
          if ((Get-FileHash $pkg[0].FullName -Algorithm SHA256).Hash.ToLower() -ne '34cc88e5ce34a2acbc2043c841f36cba118d9222d8b97e6246d506825bfaf956') { throw 'Prerequisite checksum mismatch' }
          Copy-Item $pkg[0].FullName C:/aws-c-http-prereqs/win-arm64/
          gh run download 34685606291 --repo ClayWarren/aws-c-io-feedstock --name aws-c-io-arm64-package --dir "$env:RUNNER_TEMP/aws-c-io"
          if ($LASTEXITCODE -ne 0) { throw 'Artifact download failed' }
          $pkg = @(Get-ChildItem "$env:RUNNER_TEMP/aws-c-io" -Recurse -Filter 'aws-c-io-0.27.5-haecf014_2.conda')
          if ($pkg.Count -ne 1) { throw 'Expected one exact prerequisite' }
          if ((Get-FileHash $pkg[0].FullName -Algorithm SHA256).Hash.ToLower() -ne '5d5a01f95ad863b2043506b9aacae2175f47b649ce79733ef2b72b19c79b343a') { throw 'Prerequisite checksum mismatch' }
          Copy-Item $pkg[0].FullName C:/aws-c-http-prereqs/win-arm64/
          gh run download 34683192859 --repo ClayWarren/aws-c-compression-feedstock --name aws-c-compression-arm64-package --dir "$env:RUNNER_TEMP/aws-c-compression"
          if ($LASTEXITCODE -ne 0) { throw 'Artifact download failed' }
          $pkg = @(Get-ChildItem "$env:RUNNER_TEMP/aws-c-compression" -Recurse -Filter 'aws-c-compression-0.3.2-h30dcfef_1.conda')
          if ($pkg.Count -ne 1) { throw 'Expected one exact prerequisite' }
          if ((Get-FileHash $pkg[0].FullName -Algorithm SHA256).Hash.ToLower() -ne '6e070393418d3d268162fbeadbe87cc866eef82b6012094db8065f7fd843c7c0') { throw 'Prerequisite checksum mismatch' }
          Copy-Item $pkg[0].FullName C:/aws-c-http-prereqs/win-arm64/
      - name: Build and test aws-c-http
        shell: cmd
        env:
          BUILD_PLATFORM: win-arm64
          CI: github_actions
          CONDA_BLD_PATH: C:\bld
          CONFIG: ${{ matrix.config }}
          MINIFORGE_HOME: C:\Miniforge
          PYTHONUNBUFFERED: '1'
          UPLOAD_PACKAGES: 'False'
          CONDA_CHANNEL_PRIORITY: strict
          EXTRA_CB_OPTIONS: '-m .github/probe-channels.yaml --channel-priority strict'
          RATTLER_BUILD_COLOR: always
          RATTLER_BUILD_ENABLE_GITHUB_INTEGRATION: 'true'
        run: |
          set "flow_run_id=github_%GITHUB_RUN_ID%"
          set "remote_url=https://github.com/%GITHUB_REPOSITORY%"
          set "sha=%GITHUB_SHA%"
          call ".scripts\run_win_build.bat"
      - name: Preserve aws-c-http package
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aws-c-http-arm64-package
          path: C:\bld\win-arm64\*.conda
          if-no-files-found: warn
          retention-days: 7
